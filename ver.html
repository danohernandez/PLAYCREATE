<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob:; connect-src https://dp.neonshell5.chatgpt.site; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Jugada compartida · Design Play</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fa;color:#0c1d32;font:16px system-ui,sans-serif}
main{max-width:42rem;margin:auto;padding:1rem}
header{margin-bottom:1rem}
header p{margin:0;color:#486075;font-size:.875rem}
h1{font-size:clamp(1.4rem,5vw,2rem);margin:.2rem 0;overflow-wrap:anywhere}
h2{font-size:1.1rem;margin:0 0 .5rem;overflow-wrap:anywhere}
figure{margin:0;background:#fff;border:1px solid #d6e0e8;border-radius:.75rem;padding:.75rem}
figure img,figure svg{display:block;width:100%;height:auto;max-height:65vh;object-fit:contain}
figure [hidden]{display:none}
figcaption{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:.75rem}
nav{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:.75rem}
button{min-height:44px;padding:.5rem .8rem;border:0;border-radius:.4rem;background:#00729e;color:white;font:inherit}
button:disabled{opacity:.45}
.sequence-controls{display:grid;gap:2px;padding:7px 10px;border-radius:8px;background:#142436;color:#fff;margin:0;font:14px system-ui,sans-serif}
.sequence-controls input[type=range]{display:block;width:100%;min-height:23px;margin:0;accent-color:#83d7ff;background:transparent;cursor:pointer}
.sequence-controls-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sequence-controls .sequence-position{margin-inline-start:auto;white-space:nowrap}
.sequence-controls button,.sequence-controls select{min-width:37px;min-height:40px;padding:4px 7px;border:1px solid transparent;border-radius:4px;background:transparent;color:inherit;font:inherit}
.sequence-controls button{font-size:18px;line-height:1;cursor:pointer}
.sequence-controls button:hover,.sequence-controls select:hover{border-color:#83d7ff}
.sequence-controls button:disabled{opacity:.42;cursor:default}
.sequence-controls button[hidden]{display:none}
.sequence-controls select option{background:#142436;color:#fff}
.sequence-controls-row span{font-variant-numeric:tabular-nums;white-space:nowrap}
.sequence-stage:fullscreen{width:100%;height:100%;margin:0;padding:12px;background:#f4f7fa;color:#0c1d32;overflow:auto}
.sequence-controls{margin-top:.75rem}
.sequence-stage:fullscreen{display:flex;flex-direction:column}
.sequence-stage:fullscreen figure{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
.sequence-stage:fullscreen figure img,.sequence-stage:fullscreen figure svg{height:100%;max-height:none}
#play-picker{display:block;margin:0 0 1rem}
#play-picker[hidden]{display:none}
#play-choice{display:block;width:100%;margin-top:.3rem;padding:.65rem;border:1px solid #a7b9c8;border-radius:.4rem;background:#fff;color:inherit;font:inherit}

:root{color-scheme:dark;--matte-window:#181818;--matte-panel:#242424;--matte-control:#303030;--matte-line:#494949;--matte-text:#e8e8e8;--matte-muted:#b9b9b9;--matte-blue:#88aff4}
body,.sequence-stage:fullscreen{background:var(--matte-window);color:var(--matte-text)}
header p{color:var(--matte-muted)}
figure{background:var(--matte-panel);border-color:var(--matte-line)}
figure img,figure svg{background:#fff}
#play-choice,.sequence-controls,.sequence-controls select option{background:var(--matte-control);color:var(--matte-text);border-color:var(--matte-line)}
.sequence-controls input[type=range]{accent-color:var(--matte-blue)}
.sequence-controls :is(button,select):hover,.sequence-controls :is(button,select):focus-visible{border-color:var(--matte-blue)}
</style>
<main>
 <header><p>Design Play · Solo lectura</p><h1 id="title">Jugada compartida</h1></header>
 <p id="message" role="status">Cargando jugada…</p>
 <label id="play-picker" hidden>Jugada<select id="play-choice"></select></label>
 <section id="play" class="sequence-stage" hidden>
  <h2 id="step"></h2>
  <figure><img id="court" alt="Diagrama de la cancha" hidden><svg id="animated-court" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de la cancha" hidden></svg><figcaption id="notes"></figcaption></figure>
  <nav class="sequence-controls" aria-label="Controles de reproducción"><input id="progress" type="range" min="0" value="0" step="1" aria-label="Progreso del video"><div class="sequence-controls-row"><button id="toggle" type="button" title="Reproducir" aria-label="Reproducir">▶</button><button id="previous" type="button" title="Secuencia anterior" aria-label="Secuencia anterior">⏮</button><button id="next" type="button" title="Secuencia siguiente" aria-label="Secuencia siguiente">⏭</button><span id="clock">0:00 / 0:00</span><span id="position" class="sequence-position" aria-live="polite"></span><select id="speed" aria-label="Velocidad" title="Velocidad"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><button id="fullscreen" type="button" title="Pantalla completa" aria-label="Pantalla completa">⛶</button></div></nav>
 </section>
</main>
<script src="./court-svg.js?v=104"></script>
<script src="./sequence-playback.js?v=126"></script>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>document.getElementById(id);
const message=byId('message');
async function readSharedPlay(){
 let compressed;
 const code=new URLSearchParams(location.search).get('s');
 if(code!==null){
  if(!/^[A-Za-z0-9_-]{16}$/.test(code))throw Error('Código inválido');
  const response=await fetch('https://dp.neonshell5.chatgpt.site/api/shares/'+code,{signal:AbortSignal.timeout(15000)});
  if(!response.ok||!response.body)throw Error('Enlace no disponible');
  compressed=response.body;
 }else{
  const match=location.hash.match(/^#j[12]\.([A-Za-z0-9_-]{1,24000})$/);
  if(!match)throw Error('Enlace incompleto');
  const encoded=match[1].replace(/-/g,'+').replace(/_/g,'/');
  const bytes=Uint8Array.from(atob(encoded),character=>character.charCodeAt(0));
  compressed=new Blob([bytes]).stream();
 }
 let size=0;
 const limit=new TransformStream({transform(chunk,controller){
  size+=chunk.byteLength;
  if(size>4*1024*1024)throw Error('Jugada demasiado grande');
  controller.enqueue(chunk);
 }});
 const stream=compressed.pipeThrough(new DecompressionStream('gzip')).pipeThrough(limit);
 const data=JSON.parse(await new Response(stream).text());
 const isPlay=play=>typeof play?.name==='string'&&Array.isArray(play.steps)&&play.steps.length>0&&
  play.steps.every(step=>typeof step?.name==='string'&&typeof step.notes==='string'&&(typeof step.svg==='string'||Array.isArray(step.elements)));
 const folder=Array.isArray(data?.plays);
 const plays=folder?data.plays:[data];
 if(typeof data?.name!=='string'||!plays.length||!plays.every(isPlay))throw Error('Contenido inválido');
 return {name:data.name,plays,folder};
}
async function showSharedPlay(){
 try{
  const data=await readSharedPlay();
  let imageUrl,selectedPlay=data.plays[0];
  const court=byId('court'),animatedCourt=byId('animated-court');
  function render(step,index){
   if(imageUrl){URL.revokeObjectURL(imageUrl);imageUrl=null;}
   byId('step').textContent=step.name||'Secuencia '+(index+1);
   byId('notes').textContent=step.notes;
   byId('notes').hidden=!step.notes;
   const canAnimate=!!step.motion;
   animatedCourt.toggleAttribute('hidden',!canAnimate);
   court.hidden=canAnimate;
   if(canAnimate){
    court.removeAttribute('src');
    return createCourtMotion(animatedCourt,step.elements,step.full,step.motion);
   }
   // Older links contain a pre-rendered SVG. Keep it in an image context.
   const svg=step.svg.replace(/<path data-dribble-arrowhead(?=\s+d=)/g,'<path data-dribble-arrowhead=""');
   imageUrl=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
   court.src=imageUrl;
  }
  const playback=createSequencePlayback({previous:byId('previous'),next:byId('next'),toggle:byId('toggle'),speed:byId('speed'),position:byId('position'),progress:byId('progress'),clock:byId('clock'),fullscreen:byId('fullscreen'),fullscreenTarget:byId('play'),render});
  document.addEventListener('keydown',playback.handleSpace);
  function loadPlay(play){
   const frames=play.steps.map(step=>{
    if(!Array.isArray(step.elements))return step;
    const elements=unpackSharedElements(step.elements);
    return {...step,elements,full:play.full,motion:prepareCourtMotion(elements)};
   });
   playback.load(connectPlaybackFrames(frames));
  }
  byId('title').textContent=data.name;
  document.title=data.name+' · Design Play';
  if(data.folder){
   const choice=byId('play-choice');
   data.plays.forEach((play,i)=>choice.add(new Option(play.name,String(i))));
   choice.onchange=()=>{selectedPlay=data.plays[Number(choice.value)];loadPlay(selectedPlay)};
   byId('play-picker').hidden=false;
  }
  loadPlay(selectedPlay);
  byId('play').hidden=false;
  message.hidden=true;
 }catch(error){
  message.textContent='No se pudo abrir el contenido compartido. Pide que te envíen el enlace completo y ábrelo en un navegador actualizado.';
 }
}
showSharedPlay();
</script>
</html>
